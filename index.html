<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Dịch Vụ Auto</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .container { background: #1e293b; border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
    h2 { text-align: center; color: #f59e0b; margin-bottom: 8px; font-size: 1.5rem; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #cbd5e1; }
    input[type="text"], select { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #475569; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
    input[type="text"]:focus, select:focus { border-color: #f59e0b; }
    
    .btn-submit { width: 100%; padding: 14px; background: #f59e0b; color: #0f172a; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: #d97706; }
    
    #payment-section { display: none; margin-top: 24px; padding-top: 20px; border-top: 1px dashed #475569; text-align: center; }
    .qr-box { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin: 12px 0; }
    .qr-box img { width: 200px; height: 200px; display: block; }
    
    .info-row { background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 0.9rem; }
    .info-label { color: #94a3b8; }
    .info-value { font-weight: 700; color: #fff; }
    .highlight { color: #ef4444; font-size: 1.1rem; }
    
    .status-badge { display: inline-block; padding: 6px 12px; background: #0284c7; color: #fff; border-radius: 20px; font-size: 0.8rem; margin-top: 8px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<div class="container">
  <h2>Kích Hoạt Dịch Vụ Auto</h2>
  <p class="subtitle">Thanh toán tự động 24/7 qua ZaloPay</p>

  <!-- Chọn dịch vụ -->
  <div class="form-group">
    <label for="service">Chọn dịch vụ cần mua</label>
    <select id="service">
      <option value="LK" data-price="50000">Locket Gold - 50.000 VNĐ</option>
      <option value="YT" data-price="35000">YouTube Premium - 35.000 VNĐ</option>
      <option value="SP" data-price="30000">Spotify Premium - 30.000 VNĐ</option>
    </select>
  </div>

  <!-- Nhập Username hoặc Email -->
  <div class="form-group">
    <label for="account-info">Tài khoản (Username / Email)</label>
    <input type="text" id="account-info" placeholder="Nhập Email hoặc Username của bạn" autocomplete="off">
  </div>

  <button class="btn-submit" onclick="handleCreateOrder()">Xác Nhận & Thanh Toán</button>

  <div id="payment-section">
    <div class="status-badge">Đang chờ nhận tiền...</div>
    
    <div class="qr-box">
      <img id="qr-code" src="" alt="Mã QR Chuyển Khoản ZaloPay">
    </div>

    <div class="info-row">
      <span class="info-label">Chủ tài khoản:</span>
      <span class="info-value">NGO QUANG HUY</span>
    </div>

    <div class="info-row">
      <span class="info-label">Dịch vụ:</span>
      <span class="info-value" id="service-display">---</span>
    </div>

    <div class="info-row">
      <span class="info-label">Số tiền:</span>
      <span class="info-value highlight" id="amount-display">0 VNĐ</span>
    </div>
    
    <div class="info-row">
      <span class="info-label">Nội dung CK:</span>
      <span class="info-value highlight" id="order-code">---</span>
    </div>

    <div class="info-row">
      <span class="info-label">Tài khoản nhận:</span>
      <span class="info-value" id="user-display">---</span>
    </div>

    <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 12px;">
      * Quét QR bằng ứng dụng ngân hàng hoặc ZaloPay.<br>
      * Giữ nguyên <strong>Nội dung CK</strong> để hệ thống tự động kích hoạt.
    </p>
  </div>
</div>

<script>
  let checkInterval = null;

  function handleCreateOrder() {
    const accountInfo = document.getElementById('account-info').value.trim();
    const serviceSelect = document.getElementById('service');
    
    if (!accountInfo) {
      alert('Vui lòng nhập Email hoặc Username của bạn!');
      return;
    }

    const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
    const servicePrefix = selectedOption.value;
    const amount = parseInt(selectedOption.getAttribute('data-price'));
    const serviceName = selectedOption.text.split(' - ')[0];

    // Tạo mã giao dịch duy nhất
    const randomCode = servicePrefix + Math.floor(10000 + Math.random() * 90000);
    
    const bankId = "970454"; // ZaloPay / BVB
    const accountNo = "0702241478"; 
    const accountName = "NGO QUANG HUY";

    // Cập nhật giao diện
    document.getElementById('service-display').innerText = serviceName;
    document.getElementById('amount-display').innerText = amount.toLocaleString('vi-VN') + ' VNĐ';
    document.getElementById('order-code').innerText = randomCode;
    document.getElementById('user-display').innerText = accountInfo;

    // Tạo VietQR
    const qrUrl = `https://img.vietqr.io/image/${bankId}-${accountNo}-compact2.png?amount=${amount}&addInfo=${randomCode}&accountName=${encodeURIComponent(accountName)}`;
    document.getElementById('qr-code').src = qrUrl;

    document.getElementById('payment-section').style.display = 'block';

    // Bắt đầu vòng lặp kiểm tra trạng thái thanh toán từ Webhook Vercel
    startCheckingPayment(randomCode);
  }

  function startCheckingPayment(code) {
    if (checkInterval) clearInterval(checkInterval);

    checkInterval = setInterval(async () => {
      try {
        // Gọi API Webhook để kiểm tra mã đơn
        const res = await fetch(`/api/webhook?code=${code}`);
        const data = await res.json();

        if (data.paid) {
          clearInterval(checkInterval);
          alert(`Thanh toán thành công cho mã đơn ${code}! Hệ thống đang kích hoạt dịch vụ...`);
          
          // Cập nhật giao diện báo thành công
          const statusBadge = document.querySelector('.status-badge');
          statusBadge.innerText = 'Thanh toán thành công!';
          statusBadge.style.background = '#22c55e';
        }
      } catch (err) {
        console.error("Lỗi khi kiểm tra thanh toán:", err);
      }
    }, 3000); // Kiểm tra lại sau mỗi 3 giây
  }
</script>

</body>
</html>
