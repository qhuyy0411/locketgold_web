<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Tự Động</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #151b2b; padding: 25px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .qr-box { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; margin-bottom: 15px; }
        .qr-box img { width: 200px; height: 200px; display: block; }
        .info { text-align: left; font-size: 14px; margin-bottom: 20px; }
        .info div { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #222b45; padding-bottom: 4px; }
        .status-box { padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; background: #222b45; color: #f39c12; }
        .status-box.success { background: #27ae60; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Quét Mã VietQR MB Bank</h3>
        <div class="qr-box">
            <!-- Thay link QR của bạn vào src nếu cần -->
            <img id="qrImage" src="" alt="QR Code">
        </div>
        <div class="info">
            <div><span>Ngân hàng:</span> <b>MB Bank</b></div>
            <div><span>Số tài khoản:</span> <b>0702241478</b></div>
            <div><span>Chủ tài khoản:</span> <b>NGO QUANG HUY</b></div>
            <div><span>Số tiền:</span> <b style="color: #2ecc71;">50.000 VNĐ</b></div>
            <div><span>Nội dung CK:</span> <b id="orderCodeText" style="color: #e74c3c;">...</b></div>
        </div>
        <div id="statusBox" class="status-box">
            ⌛ Đang chờ chuyển khoản...
        </div>
    </div>

    <script>
        // 1. Tự động sinh mã đơn hàng ngẫu nhiên dạng LKxxxx hoặc lấy từ logic hiện tại của bạn
        const currentOrderCode = "LK" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('orderCodeText').innerText = currentOrderCode;

        // 2. Tạo link QR VietQR tự động dựa trên mã và số tiền
        const qrUrl = `https://img.vietqr.io/image/MB-0702241478-compact2.png?amount=50000&addInfo=${currentOrderCode}&accountName=NGO%20QUANG%20HUY`;
        document.getElementById('qrImage').src = qrUrl;

        // 3. Cơ chế Polling gọi lên Vercel kiểm tra trạng thái mỗi 3 giây
        const webhookCheckUrl = `https://locketgold-web-qhuyy0411.vercel.app/api/webhook?orderCode=${currentOrderCode}`;

        const checkInterval = setInterval(() => {
            fetch(webhookCheckUrl, {
                method: 'GET',
                mode: 'cors',
                headers: { 'Accept': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'SUCCESS' || data.success === true) {
                    // Đổi giao diện sang thành công màu xanh lập tức
                    const statusBox = document.getElementById('statusBox');
                    statusBox.className = "status-box success";
                    statusBox.innerHTML = "✔ Thanh toán thành công!";
                    
                    // Dừng vòng lặp kiểm tra
                    clearInterval(checkInterval);
                }
            })
            .catch(err => {
                console.log('Đang chờ phản hồi từ server...');
            });
        }, 3000);
    </script>
</body>
</html>
