<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán tự động Locket Gold</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #333; }
        .qr-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px dashed #cbd5e1;
        }
        .code-highlight {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Trạng thái thành công (Xanh) */
        .success-box {
            background-color: #dcfce7;
            color: #166534;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #bbf7d0;
        }
        .success-box h2 { color: #166534; }
        .btn-success {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <h2>Thanh toán đơn hàng</h2>
        <p>Quét mã QR bên dưới để chuyển khoản chính xác nội dung:</p>
        
        <div class="qr-box">
            <!-- Thay link ảnh QR ngân hàng của bạn vào đây -->
            <img src="https://img.vietqr.io/image/MB-YOUR_ACCOUNT_NUMBER-compact.png?amount=50000&addInfo=LK1234" alt="QR Code" style="max-width: 100%; border-radius: 8px;">
            <p style="margin: 10px 0 5px; color: #64748b;">Mã chuyển khoản của bạn:</p>
            <div class="code-highlight" id="order-code-display">LK1234</div>
        </div>

        <div style="color: #64748b; font-size: 14px;">
            <div class="spinner"></div> Đang chờ hệ thống xác nhận thanh toán...
        </div>
    </div>

    <script>
        // Mã đơn hàng dành riêng cho phiên giao dịch này (Bạn có thể gen ngẫu nhiên động từ code của bạn)
        const currentOrderCode = "LK1234";
        document.getElementById('order-code-display').innerText = currentOrderCode;

        // Thay đổi URL dưới đây bằng domain Vercel thực tế của bạn
        const WEBHOOK_URL = 'https://locketgold-web-qhuyy0411.vercel.app/api/webhook';

        const checkInterval = setInterval(async () => {
            try {
                const response = await fetch(WEBHOOK_URL, { mode: 'cors' });
                const data = await response.json();
                
                // Kiểm tra xem mã hiện tại đã nằm trong danh sách thanh toán thành công chưa
                if (data.storedCodes && data.storedCodes.includes(currentOrderCode)) {
                    clearInterval(checkInterval); // Dừng vòng lặp quét
                    
                    // Biến đổi giao diện thành công màu xanh
                    document.getElementById('app-container').innerHTML = `
                        <div class="success-box">
                            <h2>Thanh toán thành công! 🎉</h2>
                            <p>Đã nhận được tiền cho mã đơn: <b>${currentOrderCode}</b></p>
                            <a href="#" class="btn-success">Nhận Locket Gold Ngay</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Lỗi kết nối đến server:", error);
            }
        }, 3000); // Poll mỗi 3 giây
    </script>
</body>
</html>
