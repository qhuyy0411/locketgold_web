<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán tự động Locket Gold</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #333; }
        .bank-info {
            font-size: 14px;
            color: #475569;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }
        .qr-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px dashed #cbd5e1;
        }
        .code-highlight {
            font-size: 26px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
            letter-spacing: 1px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .success-box {
            background-color: #dcfce7;
            color: #166534;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #bbf7d0;
        }
        .success-box h2 { color: #166534; }
        .btn-success {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <h2>Thanh toán đơn hàng</h2>
        <p>Quét mã QR bên dưới để thanh toán tự động:</p>

        <div class="bank-info">
            <div><b>Ngân hàng:</b> MB Bank</div>
            <div><b>Số tài khoản:</b> 0702241478</div>
            <div><b>Chủ tài khoản:</b> NGO QUANG HUY</div>
        </div>
        
        <div class="qr-box">
            <!-- Ảnh QR tự động nạp thông tin và nội dung chuyển khoản -->
            <img id="qr-image" src="" alt="QR Code" style="max-width: 100%; border-radius: 8px;">
            <p style="margin: 10px 0 5px; color: #64748b;">Nội dung chuyển khoản (Bắt buộc):</p>
            <div class="code-highlight" id="order-code-display">Đang tạo mã...</div>
        </div>

        <div style="color: #64748b; font-size: 14px;">
            <div class="spinner"></div> Đang chờ hệ thống xác nhận thanh toán...
        </div>
    </div>

    <script>
        // Tự động sinh mã đơn hàng ngẫu nhiên dạng LK + 4 chữ số (Ví dụ: LK9482)
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        const currentOrderCode = "LK" + randomNum;
        
        // Hiển thị mã lên web
        document.getElementById('order-code-display').innerText = currentOrderCode;

        // Cấu hình số tiền thanh toán (Ví dụ: 50,000đ - bạn có thể đổi số tiền tùy ý)
        const amount = 50000;

        // Gắn link VietQR chuẩn xác với thông tin của bạn
        const qrUrl = `https://img.vietqr.io/image/MB-0702241478-compact.png?amount=${amount}&addInfo=${currentOrderCode}&accountName=NGO%20QUANG%20HUY`;
        document.getElementById('qr-image').src = qrUrl;

        // URL Webhook trên Vercel của bạn
        const WEBHOOK_URL = 'https://locketgold-web-qhuyy0411.vercel.app/api/webhook';

        // Polling kiểm tra trạng thái mỗi 3 giây
        const checkInterval = setInterval(async () => {
            try {
                const response = await fetch(WEBHOOK_URL, { mode: 'cors' });
                const data = await response.json();
                
                // Nếu mã của phiên này xuất hiện trong danh sách đã thanh toán
                if (data.storedCodes && data.storedCodes.includes(currentOrderCode)) {
                    clearInterval(checkInterval); // Dừng vòng lặp
                    
                    // Đổi giao diện sang thành công màu xanh
                    document.getElementById('app-container').innerHTML = `
                        <div class="success-box">
                            <h2>Thanh toán thành công! 🎉</h2>
                            <p>Đã nhận chuyển khoản cho mã: <b>${currentOrderCode}</b></p>
                            <a href="#" class="btn-success">Nhận Locket Gold Ngay</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Lỗi kết nối:", error);
            }
        }, 3000);
    </script>
</body>
</html>
